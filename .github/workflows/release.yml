# Builds Linux and Windows binaries and attaches them to a GitHub release.
#
# Release a version by pushing a tag:
#   git tag v0.1.0
#   git push origin v0.1.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it does not exist
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            binary: s3-fstasher
          - name: windows-x86_64
            os: windows-latest
            binary: s3-fstasher.exe
    env:
      # Lets the TLS backend build on Windows without NASM installed.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        id: package
        run: |
          dir="s3-fstasher-$TAG-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/release/${{ matrix.binary }}" README.md "$dir/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            asset="$dir.zip"
            7z a "$asset" "$dir"
          else
            asset="$dir.tar.gz"
            tar -czf "$asset" "$dir"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload to the release
        run: gh release upload "$TAG" "${{ steps.package.outputs.asset }}" --clobber

[package]
name = "filestasher"
version = "0.3.0"
edition = "2024"

[dependencies]
aes-gcm = { version = "0.11", features = ["getrandom"] }
anyhow = "1.0.104"
aws-sdk-s3 = { version = "1.161.0", features = ["behavior-version-latest"] }
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }
rfd = "0.18.0"
russh = "0.65.2"
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
slint = "1.19.0"
suppaftp = { version = "13.0.0", default-features = false, features = ["tokio"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "fs", "io-util", "macros", "sync", "time"] }
toml = "1.2.1"

[build-dependencies]
slint-build = "1.19.0"

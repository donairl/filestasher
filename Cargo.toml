[package]
name = "s3-fstasher"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
aws-sdk-s3 = { version = "1.161.0", features = ["behavior-version-latest"] }
chrono = "0.4.45"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
slint = "1.19.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "fs", "io-util", "macros"] }
toml = "1.2.1"

[build-dependencies]
slint-build = "1.19.0"

[dev-dependencies]
tempfile = "3.27.0"
